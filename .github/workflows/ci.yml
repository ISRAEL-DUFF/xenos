name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLC_VERSION: v1.30.0

jobs:
  go:
    name: Go (format, vet, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xenos
          POSTGRES_PASSWORD: xenos
          POSTGRES_DB: xenos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xenos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The integration tests create a throwaway schema per test; the URL must contain "test".
      XENOS_TEST_DATABASE_URL: postgres://xenos:xenos@localhost:5432/xenos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal web/embed.go)
          if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: Tests
        run: go test ./... -count=1
      - name: Race detector on the concurrent packages
        run: go test -race -count=1 ./internal/vm ./internal/httpapi ./internal/metering ./internal/wallet ./internal/jobs

  sqlc:
    name: sqlc output is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}
      - name: Generated code matches the queries and migrations
        run: sqlc diff

  web:
    name: Dashboard (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: Browser journey (main and manual only)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [go, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xenos
          POSTGRES_PASSWORD: xenos
          POSTGRES_DB: xenos_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xenos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XENOS_DATABASE_URL: postgres://xenos:xenos@localhost:5432/xenos_e2e?sslmode=disable
      XENOS_HTTP_ADDR: ":8080"
      XENOS_COOKIE_SECURE: "false"
      XENOS_RUN_WORKER: "true"
      XENOS_FAKE_ISPEND_CREDIT_UUSDT: "5000000"
      XENOS_METER_SPREAD_MINUTES: "0"
      XENOS_PUBLIC_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard and the binaries
        run: |
          (cd web && npm ci && npm run build)
          go build -o /tmp/xenos-api ./cmd/api
          go build -o /tmp/xenosctl ./cmd/xenosctl
      - name: Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          echo "E2E_CHROMIUM=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - name: Start the stack (fake iswallet and Proxmox) and load IPs
        run: |
          nohup /tmp/xenos-api > /tmp/xenos-api.log 2>&1 &
          sleep 5
          /tmp/xenosctl ip add 203.0.113.10-203.0.113.20 203.0.113.1
      - name: Journey
        working-directory: web
        env:
          E2E_API_LOG: /tmp/xenos-api.log
          E2E_SHOTS: /tmp/shots
          E2E_PROMOTE: /tmp/xenosctl admin grant "$E2E_EMAIL"
        run: npm run e2e || npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-and-log
          path: |
            /tmp/shots
            /tmp/xenos-api.log

  audit:
    name: Vulnerability scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm audit --omit=dev
